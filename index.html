<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a1a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f0f2f5" media="(prefers-color-scheme: light)">
  <title>EduManage Pro — نظام إدارة المدارس</title>
  <meta name="description" content="نظام إدارة المدارس المتكامل - School Management System">
  <link rel="icon" type="image/svg+xml" href="assets/edumanage-mark.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/edumanage-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20260506-clinic">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div id="app"></div>
  <div class="loading-screen" id="loading-screen">
    <div class="loader-container">
      <img class="loader-logo" src="assets/edumanage-mark.svg" alt="EduManage Pro">
      <div class="loader-ring"></div>
      <h2 class="loader-title">EduManage Pro</h2>
      <p class="loader-subtitle">جاري التحميل...</p>
    </div>
  </div>
  <div id="toast-container"></div>
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="confirm-dialog" class="confirm-dialog"></div>
  </div>

  <div id="image-viewer" class="image-viewer-modal">
    <div class="image-viewer-content">
      <button class="close-viewer" onclick="this.parentElement.parentElement.classList.remove('active')">&times;</button>
      <img id="viewer-img" src="" alt="Viewer">
      <div class="image-viewer-actions" id="viewer-actions"></div>
    </div>
  </div>
  <script type="module" src="js/app.js?v=20260506-clinic"></script>
  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
